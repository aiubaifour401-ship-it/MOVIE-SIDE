apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cineverse-ingress
  namespace: cineverse-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "1000m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - cineverse.io
    - api.cineverse.io
    secretName: cineverse-tls-cert
  rules:
  - host: cineverse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cineverse-backend-service
            port:
              number: 80
  - host: api.cineverse.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cineverse-backend-service
            port:
              number: 80
