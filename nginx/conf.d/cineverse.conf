upstream cineverse_backend {
    server cineverse-app:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name cineverse.io www.cineverse.io api.cineverse.io;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Health Check Endpoint
    location /health {
        proxy_pass http://cineverse_backend/api/health;
        access_log off;
    }

    # API Proxy with Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        limit_conn conn_limit 50;

        proxy_pass http://cineverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # HLS Video Segment Caching
    location ~ \.(m3u8|ts)$ {
        proxy_pass http://cineverse_backend;
        proxy_cache_valid 200 302 10m;
        proxy_cache_valid 404 1m;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Static Asset Handling
    location / {
        proxy_pass http://cineverse_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
